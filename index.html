<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sparkle Brain" />
  <meta name="theme-color" content="#e9b8ff" />
  <link rel="apple-touch-icon" href="img/icon-180.png" />
  <link rel="icon" href="img/icon-180.png" />
  <title>Adele's Sparkle Brain</title>
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div id="sparkles" aria-hidden="true"></div>

  <!-- LOCK SCREEN -->
  <section id="screen-lock" class="screen active">
    <div class="lock-card">
      <div class="logo">✨</div>
      <h1>Hi Adele!</h1>
      <p class="sub">Enter the secret code</p>
      <div class="code-dots"><span></span><span></span><span></span><span></span></div>
      <div class="keypad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <span></span><button data-k="0">0</button><button data-k="del" aria-label="Delete">⌫</button>
      </div>
    </div>
  </section>

  <!-- HOME -->
  <section id="screen-home" class="screen">
    <header class="home-head">
      <h1>✨ Adele's Sparkle Brain ✨</h1>
      <p class="sub">What do you want to practice?</p>
    </header>
    <div class="home-body" id="home-body"></div>
  </section>

  <!-- QUIZ -->
  <section id="screen-quiz" class="screen">
    <header class="quiz-head">
      <button class="round-btn" id="btn-home" aria-label="Home">🏠</button>
      <div class="head-mid">
        <div class="sec-label" id="sec-label"></div>
        <div class="stars" id="stars"></div>
      </div>
      <button class="round-btn" id="btn-sound" aria-label="Hear it again">🔊</button>
    </header>
    <main class="quiz-main">
      <div class="card" id="card">
        <div class="stage" id="stage"></div>
      </div>
      <div class="hint" id="hint"></div>
    </main>
  </section>

  <!-- DONE -->
  <section id="screen-done" class="screen">
    <div class="done-card">
      <div class="done-burst">🎉</div>
      <h1>You did it, Adele!</h1>
      <div class="done-stars" id="done-stars"></div>
      <p class="sub" id="done-text"></p>
      <div class="done-btns">
        <button class="big-btn" id="btn-again">✨ Play again</button>
        <button class="big-btn alt" id="btn-done-home">🏠 Home</button>
      </div>
    </div>
  </section>

  <script src="data/questions.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
